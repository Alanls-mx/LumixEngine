services:
  - type: web
    name: lumixengine-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build:server
    startCommand: npm run start:server:prod
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: REQUIRE_TRUSTED_ORIGIN
        value: "true"
      - key: CORS_ORIGINS
        value: https://lumixengine.com,https://www.lumixengine.com,https://lumixengine-frontend.onrender.com
      - key: WHATSAPP_PHONE
        value: "5512981157296"

  - type: web
    name: lumixengine-frontend
    runtime: static
    buildCommand: npm ci && npm run build:frontend
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    domains:
      - lumixengine.com
      - www.lumixengine.com
    envVars:
      - key: VITE_API_BASE_URL
        value: https://lumixengine-api.onrender.com
      - key: VITE_GA_ID
        sync: false
      - key: VITE_META_PIXEL_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
